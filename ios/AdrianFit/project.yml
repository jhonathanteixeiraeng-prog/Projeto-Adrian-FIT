name: AdrianFit
options:
  bundleIdPrefix: com.adriansantos
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 8LC38UCNVW
    CODE_SIGN_STYLE: Automatic
targets:
  AdrianFit:
    type: application
    platform: iOS
    sources:
      - AdrianFit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriansantos.fit
        PRODUCT_NAME: Adrian Fit
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Adrian Fit
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
